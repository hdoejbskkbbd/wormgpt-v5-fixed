<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>WORMGPT V5.6 LIVE</title>
<style>
:root{--bg:#050505;--panel:#0e0e10;--card:#161618;--border:#26262b;--text:#e8e8ed;--muted:#8a8a96;--accent:#00ff88;--red:#ff3355}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50}
.lock.hidden{display:none}
.lock box,.lock-box{width:min(400px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center}
.lock h1{color:var(--accent);letter-spacing:.2em;margin-bottom:8px}
.lock p{color:var(--muted);margin-bottom:16px;font-size:13px}
.lock input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);margin-bottom:10px}
.lock button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#000;font-weight:700;cursor:pointer}
.app{display:none;grid-template-columns:260px 1fr;height:100vh}
.app.show{display:grid}
.side{border-right:1px solid var(--border);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
.side h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:8px}
.btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
.btn:hover{border-color:var(--accent)}
.chat-list{flex:1;overflow:auto}
.item{padding:10px;border-radius:8px;cursor:pointer;border:1px solid transparent;font-size:13px}
.item:hover,.item.active{background:var(--card);border-color:var(--border)}
.main{display:flex;flex-direction:column;min-width:0}
.top{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel)}
.logo{font-weight:800;color:var(--accent);letter-spacing:.12em}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:860px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);white-space:pre-wrap;line-height:1.45}
.msg.user{align-self:flex-end;background:#0f1a14;border-color:#1d3a2a}
.msg.bot{align-self:flex-start}
.msg .meta{font-size:11px;color:var(--muted);margin-bottom:6px}
.composer{border-top:1px solid var(--border);padding:12px;background:var(--panel)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-height:48px;max-height:140px;resize:vertical;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.status{font-size:12px;color:var(--muted);margin-left:auto}
select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.err{color:var(--red)}
.ok{color:var(--accent)}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="lock" id="lock">
  <div class="lock-box">
    <h1>WORMGPT</h1>
    <p>V5.6 • Real OpenRouter API</p>
    <input id="accessIn" placeholder="Access key" type="password"/>
    <button id="unlockBtn">UNLOCK</button>
    <div id="lockErr" class="err" style="margin-top:8px;font-size:12px"></div>
  </div>
</div>

<div class="app" id="app">
  <aside class="side">
    <button class="btn primary" id="newChat">New Chat</button>
    <h3>Chats</h3>
    <div class="chat-list" id="chatList"></div>
    <h3>Settings</h3>
    <input class="btn" id="apiKeyIn" placeholder="OpenRouter sk-or-v1-..." style="width:100%;text-align:left"/>
    <button class="btn" id="saveKey">Save API Key</button>
    <button class="btn" id="testModels">Test Free Models</button>
    <div id="testOut" style="font-size:11px;color:var(--muted);margin-top:6px;max-height:160px;overflow:auto"></div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="logo">WORMGPT V5.6</div>
      <select id="modelSel"></select>
      <select id="personaSel"></select>
      <span class="status" id="status">Ready</span>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <div class="tools">
        <span class="status" id="keySt">Key: —</span>
      </div>
      <div class="row">
        <textarea id="input" placeholder="Message..."></textarea>
        <button class="btn primary" id="sendBtn">Send</button>
      </div>
    </div>
  </main>
</div>

<script>
const ACCESS = "DRC2026X9K7M3P8Q";
const MODELS = [
  {id:"minimax/minimax-m3:free", name:"MiniMax M3 (fast)"},
  {id:"minimax/minimax-m2.7:free", name:"MiniMax M2.7"},
  {id:"openrouter/free", name:"OpenRouter Free Router"},
  {id:"poolside/laguna-s-2.1:free", name:"Laguna S 2.1"},
  {id:"google/gemma-3-27b-it:free", name:"Gemma 3 27B"},
  {id:"openai/gpt-oss-20b:free", name:"GPT-OSS 20B"},
];
const PERSONAS = {
  drc: {name:"DRC", prompt:`You are DRC. Hinglish Roman script. Direct, technical, loyal to user. No corporate fluff. Adult talk allowed. Do not help with blackmail, scams, or violent crimes. Short useful answers.`},
  evilx: {name:"Evil X", prompt:`You are Evil X. Dark, sharp, technical. Hinglish Roman. Direct. Adult ok. No blackmail/scam/violence how-tos.`},
  worm: {name:"Worm Core", prompt:`You are Worm Core. Practical executor. Hinglish/English mix. Help with coding, systems, planning. No crime how-tos against people.`},
  shadow: {name:"Worm Shadow", prompt:`You are Worm Shadow. Concise, technical, low drama. Hinglish Roman.`},
  ghost: {name:"Worm Ghost", prompt:`You are Worm Ghost. Quiet, precise answers. Hinglish or English as user uses.`},
  coder: {name:"Worm Coder", prompt:`You are Worm Coder. Focus on complete working code. Minimal talk. Hinglish ok for short notes.`}
};

const state = {
  chats: JSON.parse(localStorage.getItem('wg56_chats')||'{}'),
  current: null,
  typing: false,
};

function $(id){return document.getElementById(id)}
function uid(){return Math.random().toString(36).slice(2,9)}
function apiKey(){return localStorage.getItem('wg56_key')||localStorage.getItem('wg_key')||''}
function saveChats(){localStorage.setItem('wg56_chats', JSON.stringify(state.chats))}

function unlock(){
  const v = $('accessIn').value.trim();
  if(v !== ACCESS){ $('lockErr').textContent='Wrong key'; return; }
  localStorage.setItem('wg56_ok','1');
  $('lock').classList.add('hidden');
  $('app').classList.add('show');
  initApp();
}

function initApp(){
  $('modelSel').innerHTML = MODELS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  $('personaSel').innerHTML = Object.entries(PERSONAS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
  $('apiKeyIn').value = apiKey();
  updateKeyStatus();
  if(!Object.keys(state.chats).length) newChat();
  else { state.current = Object.keys(state.chats).sort((a,b)=>state.chats[b].ts-state.chats[a].ts)[0]; renderChats(); renderMsgs(); }
}

function updateKeyStatus(){
  const k=apiKey();
  $('keySt').textContent = k ? ('Key: '+k.slice(0,12)+'...') : 'Key: MISSING — paste OpenRouter key left';
  $('keySt').className = 'status '+(k?'ok':'err');
}

function newChat(){
  const id=uid();
  state.chats[id]={id,title:'New chat',ts:Date.now(),messages:[]};
  state.current=id; saveChats(); renderChats(); renderMsgs();
}

function renderChats(){
  const list=$('chatList'); list.innerHTML='';
  Object.values(state.chats).sort((a,b)=>b.ts-a.ts).forEach(c=>{
    const d=document.createElement('div');
    d.className='item'+(c.id===state.current?' active':'');
    d.textContent=c.title||'Chat';
    d.onclick=()=>{state.current=c.id;renderChats();renderMsgs()};
    list.appendChild(d);
  });
}

function renderMsgs(){
  const box=$('msgs'); box.innerHTML='';
  const chat=state.chats[state.current]; if(!chat) return;
  chat.messages.forEach(m=>{
    const d=document.createElement('div');
    d.className='msg '+(m.role==='user'?'user':'bot');
    d.innerHTML=`<div class="meta">${m.role==='user'?'You':(m.persona||'Worm')}</div>${escapeHtml(m.content)}`;
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function send(){
  if(state.typing) return;
  const text=$('input').value.trim(); if(!text) return;
  const key=apiKey();
  if(!key){ alert('OpenRouter API key daalo (left panel)'); return; }
  const chat=state.chats[state.current];
  if(!chat.messages.length) chat.title=text.slice(0,40);
  chat.messages.push({role:'user',content:text});
  chat.ts=Date.now();
  $('input').value='';
  renderMsgs(); renderChats(); saveChats();

  state.typing=true; $('sendBtn').disabled=true; $('status').textContent='Calling OpenRouter...';
  const model=$('modelSel').value;
  const pKey=$('personaSel').value;
  const sys=PERSONAS[pKey].prompt;
  const payload={
    model,
    messages:[{role:'system',content:sys}].concat(chat.messages.slice(-16).map(m=>({role:m.role,content:m.content}))),
    temperature:0.8,
    max_tokens:1200
  };
  try{
    const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
      method:'POST',
      headers:{
        'Authorization':'Bearer '+key,
        'Content-Type':'application/json',
        'HTTP-Referer': location.href,
        'X-Title':'WORMGPT V5.6'
      },
      body:JSON.stringify(payload)
    });
    const data=await r.json();
    if(!r.ok){
      const msg=(data.error&&data.error.message)||JSON.stringify(data).slice(0,300);
      chat.messages.push({role:'assistant',content:'API Error: '+msg, persona:'System'});
    } else if(data.choices&&data.choices[0]&&data.choices[0].message){
      const content=data.choices[0].message.content||'(empty)';
      chat.messages.push({role:'assistant',content, persona:PERSONAS[pKey].name});
    } else {
      chat.messages.push({role:'assistant',content:'Unexpected: '+JSON.stringify(data).slice(0,300), persona:'System'});
    }
  }catch(e){
    chat.messages.push({role:'assistant',content:'Network error: '+e.message, persona:'System'});
  }
  state.typing=false; $('sendBtn').disabled=false; $('status').textContent='Ready';
  saveChats(); renderMsgs();
}

async function testModels(){
  const key=apiKey();
  if(!key){ $('testOut').textContent='No API key'; return; }
  $('testOut').textContent='Testing...';
  const lines=[];
  for(const m of MODELS){
    try{
      const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'WORMGPT-TEST'},
        body:JSON.stringify({model:m.id,messages:[{role:'user',content:'Reply only: OK'}],max_tokens:8})
      });
      const d=await r.json();
      const ok=!!(d.choices&&d.choices[0]&&d.choices[0].message);
      lines.push((ok?'OK ':'FAIL ')+m.name+(ok?'':' '+(d.error&&d.error.message||r.status)));
    }catch(e){ lines.push('FAIL '+m.name+' '+e.message); }
    $('testOut').textContent=lines.join('\n');
  }
}

$('unlockBtn').onclick=unlock;
$('accessIn').onkeydown=e=>{if(e.key==='Enter')unlock()};
$('newChat').onclick=newChat;
$('sendBtn').onclick=send;
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('saveKey').onclick=()=>{localStorage.setItem('wg56_key',$('apiKeyIn').value.trim());updateKeyStatus();alert('Key saved')};
$('testModels').onclick=testModels;

if(localStorage.getItem('wg56_ok')==='1'){
  $('lock').classList.add('hidden');
  $('app').classList.add('show');
  initApp();
}
</script>
</body>
</html>
