[phases.setup]
nixPkgs = ['python3', 'python3Packages.pip', 'python3Packages.virtualenv']

[phases.install]
cmds = [
  'python3 -m venv /app/venv',
  '/app/venv/bin/pip install -r requirements.txt'
]

[phases.build]
cmds = []

[start]
cmd = '/app/venv/bin/gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120'
