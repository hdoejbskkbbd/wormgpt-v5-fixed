[phases.setup]
nixPkgs = ["python312", "python312Packages.pip"]

[phases.install]
cmds = ["python3 -m venv /opt/venv && /opt/venv/bin/pip install --break-system-packages -r requirements.txt || /opt/venv/bin/pip install -r requirements.txt"]

[start]
cmd = "/opt/venv/bin/gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
